name: Keep Render Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://hongrui-boss-erp-api.onrender.com/api/auth/me)
          echo "HTTP $code (401 属正常，说明服务器已响应请求)"
